experiment_name: "imp_r50"
seed: 42
data:
  batch_size: 32
  num_workers: 4
model:
  name: "resnet50"
  pretrained: True
  checkpoint: "output/models/default_r50_best.pth"
method: "imp"
training:
  epochs: 0       # start directly from the loaded baseline
  lr: 0.005
  device: "cuda"
  save_dir: "output/models"
pruning:
  retrain_epochs: 10   # retrain after pruning
  targets: [0.05, 0.10, 0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.70, 0.80, 0.85]
